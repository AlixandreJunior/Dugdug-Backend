[project]
name = "dugdug"
version = "0.1.0"
description = "Projeto DugDug"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asgiref==3.8.1",
    "colorama==0.4.6",
    "coverage==7.7.1",
    "dj-database-url==2.3.0",
    "django==5.1.7",
    "django-cors-headers==4.7.0",
    "django-types>=0.22.0",
    "djangorestframework==3.15.2",
    "djangorestframework-simplejwt==5.5.0",
    "djangorestframework-types>=0.9.0",
    "dotenv==0.9.9",
    "drf-extra-fields==3.7.0",
    "filetype==1.2.0",
    "gunicorn==23.0.0",
    "iniconfig==2.1.0",
    "locust>=2.39.0",
    "packaging==24.2",
    "pillow==11.1.0",
    "pluggy==1.5.0",
    "psycopg2==2.9.10",
    "psycopg2-binary==2.9.10",
    "pyjwt==2.9.0",
    "pytest==8.3.5",
    "pytest-django==4.11.1",
    "python-dotenv==1.1.0",
    "sqlparse==0.5.3",
    "typing-extensions==4.13.2",
    "tzdata==2025.2",
]


[project.optional-dependencies]
# Substitua 'pyright' por 'ty' se for instalá-lo como dependência de desenvolvimento
dev = ["ruff", "ty", "pytest", "pytest-xdist", "pytest-django"]

# ============================
# Lint e formatação (Ruff)
# ============================
[tool.ruff]
line-length = 88
target-version = "py312"
fix = true
show-fixes = true
indent-width = 4
exclude = ["venv", ".venv", "env", ".env", "node_modules", "__pycache__"]

[tool.ruff.lint]
select = [
    "ASYNC", "A", "ANN", "B", "BLE", "C4", "C90", "COM", "E", "EM", "ERA", "EXE",
    "F", "FBT", "FIX", "I", "ICN", "ISC", "Q", "RET", "RSE", "S", "SIM", "SLF",
    "T10", "T20", "TC", "TD", "TRY", "UP", "W", "YTT", "RUF", "N",
]
ignore = ["T201", "COM812"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["ANN201", "S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint.isort]
# Ensina ao Ruff qual é o pacote principal do seu projeto.
known-first-party = ["config"]


# ============================
# Tipagem (Ty - Astral)
# ============================
[tool.ty]
# Define a versão do Python que o Ty deve usar para análise
python-version = "3.13"

# Lista de diretórios para incluir na verificação
include = ["src", "tests"]

# Lista de diretórios/arquivos para excluir
exclude = [
    "**/venv",
    "**/.venv",
    "**/env",
    "**/.env",
    "**/node_modules",
    "**/__pycache__",
]

# Define os diretórios raiz do seu projeto (onde encontrar módulos)
# O Ty pode autodetectar layouts 'src', mas ser explícito é melhor.
root = ["src"]

# Configuração de regras para emular o "modo estrito"
# "error" faz o Ty sair com um código de erro (útil para CI).
[tool.ty.rules]
# Exemplos de regras para um modo mais estrito (consulte a documentação do Ty para a lista completa)
"invalid_argument_type" = "error"
"invalid_type_form" = "error"
"missing_return_annotation" = "error"
"missing_parameter_annotation" = "error"
# Adicione outras regras que você considera "estritas" e defina-as como "error"


# Configuração de 'overrides' (como o per-file-ignores do Ruff)
[[tool.ty.overrides]]
include = ["tests/**"]
# Exemplo de como relaxar regras específicas em testes:
rules = { "missing_return_annotation" = "ignore" }


# ============================
# Testes (Pytest)
# ============================
[tool.pytest.ini_options]
addopts = "-s --color=yes --tb=short"
# Adiciona 'src' ao path do Python durante os testes.
pythonpath = ["src"]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "config.settings"


# ============================
# Build e Setuptools
# ============================
[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
package-dir = { "" = "src" }
